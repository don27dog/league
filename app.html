<html lang="en"><head><meta charset="utf-8">

<style id="appcss">
html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: score-sheet app — lane-blue header band, tab strip, ruled tables like a league recap sheet */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#15212c; --muted:#5b6876; --line:#d9dfe5;
  --lane:#1d5aa0; --lane-ink:#ffffff; --pin:#c4313b; --maple:#c99550; --good:#1f7a4d; --soft:#e8eef5;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#17202a; --ink:#e7edf3; --muted:#9aa8b6; --line:#2a3642;
  --lane:#4b8ad6; --lane-ink:#0b1219; --pin:#ee5d66; --maple:#d9aa66; --good:#4cc08a; --soft:#1d2a37; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#17202a; --ink:#e7edf3; --muted:#9aa8b6; --line:#2a3642;
  --lane:#4b8ad6; --lane-ink:#0b1219; --pin:#ee5d66; --maple:#d9aa66; --good:#4cc08a; --soft:#1d2a37; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--lane);color:var(--lane-ink)}
header.band .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:2.1rem;letter-spacing:.02em;margin:0;text-transform:uppercase;text-wrap:balance}
.brand .meta{font-size:.85rem;opacity:.85}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font:600 .9rem var(--body);background:transparent;color:inherit;border:0;padding:10px 14px;border-radius:8px 8px 0 0;cursor:pointer;opacity:.85;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--bg);color:var(--ink);opacity:1}
nav.tabs button:focus-visible{outline:2px solid var(--maple);outline-offset:-2px}
main .wrap{padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--display);font-weight:800;font-size:1.5rem;text-transform:uppercase;letter-spacing:.03em;margin:0}
h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.sec{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--soft)}
th:first-child,td:first-child,.l{text-align:left}
tr:last-child td{border-bottom:0}
td.num-strong{font-weight:700}
.rank{font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--lane);width:2.2em}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--soft);color:var(--muted)}
.pill.win{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.loss{background:color-mix(in srgb,var(--pin) 15%,transparent);color:var(--pin)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input,select{font:500 .95rem var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--lane);outline-offset:1px}
input.g{width:3.6em;text-align:center;padding:6px 2px;font-variant-numeric:tabular-nums}
input.g.bad{border-color:var(--pin)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--lane)}
.btn{font:600 .9rem var(--body);border-radius:8px;padding:9px 16px;border:1px solid var(--lane);background:var(--lane);color:var(--lane-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--lane)}
.btn.danger{background:transparent;border-color:var(--pin);color:var(--pin)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.note{font-size:.85rem;color:var(--muted);max-width:68ch}
.banner{border-left:4px solid var(--maple);background:var(--surface);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.9rem}
.hcpbox{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.formula{font-family:var(--display);font-size:1.25rem;font-weight:600;letter-spacing:.02em}
.match{display:flex;flex-direction:column;gap:10px}
.match-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.match-head b{font-family:var(--display);font-size:1.2rem;text-transform:uppercase;letter-spacing:.02em}
.vs{color:var(--pin);font-family:var(--display);font-weight:800;padding:0 6px}
tr.tot td{font-weight:700;background:var(--soft)}
tr.abs td{color:var(--muted)}
td.mv{white-space:nowrap}
.mvb{font:600 .8rem var(--body);width:2.2em;height:2.2em;margin-left:4px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--lane);cursor:pointer}
.mvb:disabled{opacity:.3;cursor:default}
tr.sub-tot td{color:var(--muted);font-size:.85rem}
td.win{color:var(--good);font-weight:800}
.highs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.hs li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.hs li:last-child{border-bottom:0}
.hs ol{list-style:none;margin:0;padding:0}
.hs .score{font-family:var(--display);font-weight:800;font-size:1.35rem;color:var(--lane);font-variant-numeric:tabular-nums}
.hs .who{min-width:0}
.hs .who span{display:block;font-size:.78rem;color:var(--muted)}
.medal{display:inline-block;width:1.4em;color:var(--maple);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (max-width:520px){h1{font-size:1.7rem}th,td{padding:7px 7px}}
@media (prefers-reduced-motion:no-preference){nav.tabs button{transition:background .15s}}
nav.tabs a{font:600 .9rem var(--body);color:inherit;text-decoration:none;padding:10px 14px;opacity:.9;white-space:nowrap;border-radius:8px 8px 0 0}
nav.tabs a:hover{background:color-mix(in srgb,var(--bg) 18%,transparent)}
[id]{scroll-margin-top:12px}
details summary{cursor:pointer}
#ghStatus:empty{display:none}
</style>
</head><body>

<header class="band">
  <div class="wrap">
    <div class="brand"><h1 id="lgName">Bowling League</h1><span class="meta" id="lgMeta">Loading league…</span></div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="standings" aria-selected="true">Standings</button>
      <button role="tab" data-tab="results" aria-selected="false">Weekly Results</button>
      <button role="tab" data-tab="scores" aria-selected="false">Enter Scores</button>
      <button role="tab" data-tab="bowlers" aria-selected="false">Averages &amp; Handicaps</button>
      <button role="tab" data-tab="highs" aria-selected="false">High Scores</button>
      <button role="tab" data-tab="teams" aria-selected="false">Teams</button>
      <button role="tab" data-tab="export" aria-selected="false">Print &amp; Export</button>
      <button role="tab" data-tab="web" aria-selected="false">Website</button>
      <button role="tab" data-tab="settings" aria-selected="false">Settings</button>
    </nav>
  </div>
</header>
<main><div class="wrap" id="view"><div class="empty">Loading league…</div></div></main>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DEFAULTS = {name:"Bowling League", teamsCount:8, playersPerTeam:4, weeks:30, gamesPerWeek:3,
  hcpBasis:220, hcpPct:90, hcpMax:0, ptsPerGame:1, ptsSeries:1, absentPenalty:10, teams:[]};

let db=null, canWrite=false, config=null, weeks={}, tab="standings", loaded={config:false,weeks:false};
let entryWeek=null, draft=null, draftDirty=false, highsWeek=null, pendingConfirm=null;

function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}

// ---------- league structure ----------
function normalize(c){
  c={...DEFAULTS,...c};
  const teams=[];
  for(let i=0;i<c.teamsCount;i++){
    const old=(c.teams||[])[i]||{};
    const players=[], used=new Set((old.players||[]).slice(0,c.playersPerTeam).map(x=>x&&x.id).filter(Boolean));
    for(let j=0;j<c.playersPerTeam;j++){
      const op=(old.players||[])[j]||{};
      let id=op.id; if(!id){ let n=j+1; while(used.has(`t${i+1}p${n}`)) n++; id=`t${i+1}p${n}`; } used.add(id);
      players.push({id, name:op.name||`Bowler ${i+1}-${j+1}`, startAvg:Number(op.startAvg)||0});
    }
    teams.push({id:`t${i+1}`, name:old.name||`Team ${i+1}`, players});
  }
  c.teams=teams;
  c.subs=(c.subs||[]).map(s=>({id:s.id,name:s.name||"Sub",startAvg:Number(s.startAvg)||0}));
  return c;
}
function roundRobin(n, weekIdx){
  const ids=[...Array(n)].map((_,i)=>`t${i+1}`); if(n%2) ids.push(null);
  const m=ids.length, rounds=m-1, r=weekIdx%rounds;
  const rot=[ids[0], ...ids.slice(1).slice(r), ...ids.slice(1).slice(0,r)];
  const out=[]; for(let i=0;i<m/2;i++){const a=rot[i], b=rot[m-1-i]; if(a&&b) out.push({a,b});}
  return out;
}
const hcpFor = avg => { if(!avg) return 0; let h=Math.floor(Math.max(0,config.hcpBasis-avg)*config.hcpPct/100); if(config.hcpMax>0) h=Math.min(h,config.hcpMax); return h; };

// ---------- the whole season, computed from raw scores ----------
function compute(){
  const G=config.gamesPerWeek, players={}, teamOf={};
  config.teams.forEach(t=>t.players.forEach(p=>{players[p.id]={...p,team:t.name,teamId:t.id,pins:0,games:0,hg:0,hs:0}; teamOf[p.id]=t.id;}));
  config.subs.forEach(s=>{players[s.id]={...s,team:"Sub",teamId:null,isSub:true,pins:0,games:0,hg:0,hs:0};});
  const teams={}; config.teams.forEach(t=>teams[t.id]={id:t.id,name:t.name,won:0,lost:0,scratch:0,hdcp:0,weeks:0});
  const weekly={}, season={sg:[],ss:[],hg:[],hs:[],tsg:[],tss:[],thg:[],ths:[]}, results={};
  const nums=Object.keys(weeks).map(Number).sort((a,b)=>a-b);
  for(const w of nums){
    const wk=weeks[w]; if(!wk) continue;
    const entering={};
    for(const pid in players){const p=players[pid]; const avg=p.games?Math.floor(p.pins/p.games):p.startAvg; entering[pid]={avg,hcp:hcpFor(avg)};}
    const W={sg:[],ss:[],hg:[],hs:[],tsg:[],tss:[],thg:[],ths:[]}; weekly[w]=W; results[w]=[];
    const line=(pid)=>{const e=(wk.games||{})[pid]||{};
      const bowler=(!e.abs&&e.sub&&players[e.sub])?e.sub:pid; const en=entering[bowler];
      const gs=[]; for(let g=0;g<G;g++){let v=e.abs?Math.max(0,en.avg-config.absentPenalty):(e.g||[])[g]; gs.push(v===""||v==null?null:Number(v));}
      return {pid,bowler,abs:!!e.abs,gs,avg:en.avg,hcp:en.hcp};};
    for(const m of (wk.matchups||[])){
      if(!teams[m.a]||!teams[m.b]) continue;
      const side=tid=>{const ls=config.teams.find(t=>t.id===tid).players.map(p=>line(p.id));
        const per=[...Array(G)].map((_,g)=>ls.some(l=>l.gs[g]==null)?null:ls.reduce((s,l)=>s+l.gs[g]+l.hcp,0));
        const scr=[...Array(G)].map((_,g)=>ls.reduce((s,l)=>s+(l.gs[g]??0),0));
        return {ls,per,scr};};
      const A=side(m.a), B=side(m.b); let pa=0,pb=0,complete=true;
      for(const [X,tid,oid] of [[A,m.a,m.b],[B,m.b,m.a]]){ const tag={pid:tid,name:teams[tid].name,team:`vs ${teams[oid].name}`,week:w};
        X.per.forEach((v,g)=>{ if(v!=null){ W.thg.push({...tag,v}); W.tsg.push({...tag,v:X.scr[g]}); } });
        if(X.per.every(v=>v!=null)){ W.ths.push({...tag,v:X.per.reduce((s,v)=>s+v,0)}); W.tss.push({...tag,v:X.scr.reduce((s,v)=>s+v,0)}); } }
      for(let g=0;g<G;g++){ if(A.per[g]==null||B.per[g]==null){complete=false;continue;}
        if(A.per[g]>B.per[g]) pa+=config.ptsPerGame; else if(B.per[g]>A.per[g]) pb+=config.ptsPerGame; else {pa+=config.ptsPerGame/2;pb+=config.ptsPerGame/2;} }
      const ta=A.per.reduce((s,v)=>s+(v??0),0), tb=B.per.reduce((s,v)=>s+(v??0),0);
      if(complete){ if(ta>tb) pa+=config.ptsSeries; else if(tb>ta) pb+=config.ptsSeries; else {pa+=config.ptsSeries/2;pb+=config.ptsSeries/2;} }
      const any=A.per.some(v=>v!=null)||B.per.some(v=>v!=null);
      if(any){
        teams[m.a].won+=pa; teams[m.a].lost+=pb; teams[m.b].won+=pb; teams[m.b].lost+=pa;
        teams[m.a].scratch+=A.scr.reduce((s,v)=>s+v,0); teams[m.b].scratch+=B.scr.reduce((s,v)=>s+v,0);
        teams[m.a].hdcp+=ta; teams[m.b].hdcp+=tb; teams[m.a].weeks++; teams[m.b].weeks++;
      }
      results[w].push({a:m.a,b:m.b,pa,pb,ta,tb,complete,any});
    }
    // personal stats: only real (non-absent) games
    for(const tm of config.teams) for(const slot of tm.players){
      const l=line(slot.id); if(l.abs) continue; const real=l.gs.filter(v=>v!=null); if(!real.length) continue;
      const p=players[l.bowler], tag={pid:l.bowler,name:p.name,team:p.isSub?`Sub for ${tm.name}`:p.team,week:w};
      real.forEach(v=>{W.sg.push({...tag,v}); W.hg.push({...tag,v:v+l.hcp}); p.hg=Math.max(p.hg,v);});
      if(real.length===G){const s=real.reduce((a,b)=>a+b,0); W.ss.push({...tag,v:s}); W.hs.push({...tag,v:s+l.hcp*G}); p.hs=Math.max(p.hs,s);}
      p.pins+=real.reduce((a,b)=>a+b,0); p.games+=real.length;
    }
    for(const k in W){W[k].sort((a,b)=>b.v-a.v); season[k].push(...W[k]);}
  }
  for(const k in season) season[k].sort((a,b)=>b.v-a.v||a.week-b.week);
  for(const pid in players){const p=players[pid]; p.avg=p.games?Math.floor(p.pins/p.games):p.startAvg; p.hcp=hcpFor(p.avg); p.est=!p.games;}
  return {players,teams,weekly,season,results,weeksBowled:nums.filter(w=>(results[w]||[]).some(r=>r.any))};
}

// ---------- rendering ----------
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  if(!loaded.config){ $("#view").innerHTML=`<div class="empty">Loading league…</div>`; return; }
  if(!config){ renderSetup(); return; }
  $("#lgName").textContent=config.name;
  const S=compute();
  $("#lgMeta").textContent=`${config.teamsCount} teams · ${config.playersPerTeam} per team · week ${S.weeksBowled.length} of ${config.weeks} · handicap ${config.hcpPct}% of ${config.hcpBasis}`;
  const v=$("#view");
  const ro = canWrite?"":`<div class="banner">You're viewing this league read-only. Only the league secretary can enter scores or change settings.</div>`;
  if(tab==="standings") v.innerHTML=ro+standings(S);
  else if(tab==="results") v.innerHTML=resultsView(S);
  else if(tab==="scores") renderEntry(S);
  else if(tab==="bowlers") v.innerHTML=bowlers(S);
  else if(tab==="highs") v.innerHTML=highs(S);
  else if(tab==="teams") renderTeams();
  else if(tab==="settings") renderSettings();
  else if(tab==="export") renderExport(S);
  else if(tab==="web") renderWeb();
}

function standings(S){
  const ts=Object.values(S.teams).sort((a,b)=>b.won-a.won||b.hdcp-a.hdcp);
  const lead=ts[0]?.won??0;
  const rows=ts.map((t,i)=>`<tr><td class="rank">${i+1}</td><td class="l"><b>${esc(t.name)}</b></td>
    <td class="num-strong">${fmt(t.won)}</td><td>${fmt(t.lost)}</td><td>${t.won+t.lost?((t.won/(t.won+t.lost))*100).toFixed(1)+"%":"—"}</td>
    <td class="muted">${i===0?"—":fmt(lead-t.won)}</td><td>${t.scratch.toLocaleString()}</td><td>${t.hdcp.toLocaleString()}</td></tr>`).join("");
  const last=S.weeksBowled[S.weeksBowled.length-1];
  const tn=id=>esc(config.teams.find(t=>t.id===id)?.name);
  const recap=last?S.results[last].map(r=>`<tr><td class="l">${tn(r.a)} <span class="pill ${r.pa>r.pb?"win":r.pa<r.pb?"loss":""}">${fmt(r.pa)}</span></td>
    <td>${r.ta.toLocaleString()}</td><td class="vs">vs</td><td>${r.tb.toLocaleString()}</td>
    <td class="l"><span class="pill ${r.pb>r.pa?"win":r.pb<r.pa?"loss":""}">${fmt(r.pb)}</span> ${tn(r.b)}${r.complete?"":' <span class="pill">in progress</span>'}</td></tr>`).join(""):"";
  return `<section class="sec"><h2>Team Standings</h2>
   <div class="tbl"><table><thead><tr><th></th><th>Team</th><th>Won</th><th>Lost</th><th>Pct</th><th>Behind</th><th>Scratch Pins</th><th>Pins + Hdcp</th></tr></thead><tbody>${rows}</tbody></table></div>
   <p class="note">Each match is worth ${fmt(config.ptsPerGame)} point${config.ptsPerGame==1?"":"s"} per game plus ${fmt(config.ptsSeries)} for the higher total series, all with handicap. Ties split the points. Ties in standings break on total pins with handicap.</p></section>
   ${last?`<section class="sec"><h2>Week ${last} Results</h2><div class="tbl"><table><thead><tr><th>Team</th><th>Series + Hdcp</th><th></th><th>Series + Hdcp</th><th>Team</th></tr></thead><tbody>${recap}</tbody></table></div></section>`
   :`<div class="card empty">No scores yet. Open <b>Enter Scores</b> to record week 1.</div>`}`;
}
const fmt=n=>Number.isInteger(n)?String(n):n.toFixed(1);

function bowlers(S){
  const ps=Object.values(S.players).sort((a,b)=>b.avg-a.avg||a.name.localeCompare(b.name));
  return `<section class="sec"><h2>Averages &amp; Handicaps</h2>
  <p class="note">Handicap = ${config.hcpPct}% of (${config.hcpBasis} − average), rounded down${config.hcpMax>0?`, capped at ${config.hcpMax}`:""}. The handicap shown applies to the next week bowled. Bowlers with no games yet use their starting average (marked “est”). Absent (blind) games count for the team but not for the bowler's average.</p>
  <div class="tbl"><table><thead><tr><th>Bowler</th><th class="l">Team</th><th>Games</th><th>Pins</th><th>Average</th><th>Handicap</th><th>High Game</th><th>High Series</th></tr></thead><tbody>
  ${ps.map(p=>`<tr><td class="l"><b>${esc(p.name)}</b></td><td class="l muted">${esc(p.team)}</td><td>${p.games}</td><td>${p.pins.toLocaleString()}</td>
  <td class="num-strong">${p.avg||"—"}${p.est&&p.avg?' <span class="pill">est</span>':""}</td><td class="num-strong">${p.avg?p.hcp:"—"}</td><td>${p.hg||"—"}</td><td>${p.hs||"—"}</td></tr>`).join("")}
  </tbody></table></div></section>`;
}

function topList(title,arr,showWeek){
  const items=top3(arr);
  return `<div class="card hs"><h3>${title}</h3>${items.length?`<ol>${items.map((x,i)=>`<li><div class="who"><span class="medal">${i+1}.</span><b>${esc(x.name)}</b><span>${esc(x.team)}${showWeek?` · week ${x.week}`:""}</span></div><div class="score">${x.v}</div></li>`).join("")}</ol>`:`<p class="muted small">No scores yet.</p>`}</div>`;
}
function highs(S){
  const wks=S.weeksBowled; if(highsWeek==null||!wks.includes(highsWeek)) highsWeek=wks[wks.length-1]??null;
  const W=highsWeek?S.weekly[highsWeek]:{sg:[],ss:[],hg:[],hs:[],tsg:[],tss:[],thg:[],ths:[]};
  const teamCards=(X,sw)=>`${topList("Team High Game · Scratch",X.tsg,sw)}${topList("Team High Series · Scratch",X.tss,sw)}${topList("Team High Game · Handicap",X.thg,sw)}${topList("Team High Series · Handicap",X.ths,sw)}`;
  return `<section class="sec"><h2>Season Highs</h2><div class="highs">
   ${topList("High Game · Scratch",S.season.sg,1)}${topList("High Series · Scratch",S.season.ss,1)}
   ${topList("High Game · Handicap",S.season.hg,1)}${topList("High Series · Handicap",S.season.hs,1)}</div>
   <h3>Team</h3><div class="highs">${teamCards(S.season,1)}</div></section>
   <section class="sec"><div class="row"><h2>Weekly Highs</h2>
   <select id="hw" aria-label="Week">${wks.length?wks.map(w=>`<option value="${w}" ${w===highsWeek?"selected":""}>Week ${w}${weeks[w]?.date?" · "+esc(weeks[w].date):""}</option>`).join(""):"<option>No weeks bowled</option>"}</select></div>
   <div class="highs">${topList("High Game · Scratch",W.sg)}${topList("High Series · Scratch",W.ss)}${topList("High Game · Handicap",W.hg)}${topList("High Series · Handicap",W.hs)}</div>
   <h3>Team</h3><div class="highs">${teamCards(W)}</div>
   <p class="note">Each bowler or team appears only once per list, with their best score. Individual series counts only bowlers who bowled all ${config.gamesPerWeek} games, and blind scores are left out. Team highs use the team's full lineup for that game, including subs and blind scores.</p></section>`;
}

// ---------- score entry ----------
function freshDraft(w){
  const ex=weeks[w];
  return ex?JSON.parse(JSON.stringify({date:ex.date||"",matchups:ex.matchups||roundRobin(config.teamsCount,w-1),games:ex.games||{}}))
           :{date:"",matchups:roundRobin(config.teamsCount,w-1),games:{}};
}
function renderEntry(S){
  if(entryWeek==null){ const last=S.weeksBowled[S.weeksBowled.length-1]||0; entryWeek=Math.min(config.weeks,last+1)||1; }
  if(!draft||draft._w!==entryWeek){ draft=freshDraft(entryWeek); draft._w=entryWeek; draftDirty=false; }
  const G=config.gamesPerWeek, dis=canWrite?"":"disabled";
  const S2=entering(entryWeek);
  const teamOpts=sel=>config.teams.map(t=>`<option value="${t.id}" ${t.id===sel?"selected":""}>${esc(t.name)}</option>`).join("");
  const side=(tid,mi,k)=>{const t=config.teams.find(x=>x.id===tid); if(!t) return "";
    return `<div class="tbl"><table><thead><tr><th class="l">${esc(t.name)}</th><th>Avg</th><th>Hdcp</th>${[...Array(G)].map((_,g)=>`<th>G${g+1}</th>`).join("")}<th>Series</th><th>Abs</th></tr></thead><tbody>
    ${t.players.map(p=>{const e=draft.games[p.id]||{}; const bw=(!e.abs&&e.sub&&S2[e.sub])?e.sub:p.id; const en=S2[bw];
      return `<tr data-p="${p.id}" class="${e.abs?"abs":""}"><td class="l">${nameCell(p,e,dis)}</td><td>${en.avg||"—"}</td><td>${en.hcp}</td>
      ${[...Array(G)].map((_,g)=>`<td><input class="g" id="g_${p.id}_${g}" inputmode="numeric" maxlength="3" data-p="${p.id}" data-g="${g}" value="${e.abs?"":esc((e.g||[])[g]??"")}" ${e.abs?"disabled":""} ${dis} aria-label="${esc(p.name)} game ${g+1}"></td>`).join("")}
      <td class="num-strong" id="ser_${p.id}"></td><td><input type="checkbox" id="abs_${p.id}" data-abs="${p.id}" ${e.abs?"checked":""} ${dis} aria-label="${esc(p.name)} absent"></td></tr>`;}).join("")}
    <tr class="tot"><td class="l">Scratch + Hdcp</td><td></td><td></td>${[...Array(G)].map((_,g)=>`<td id="tt_${mi}_${k}_${g}"></td>`).join("")}<td id="tt_${mi}_${k}_s"></td><td></td></tr>
    </tbody></table></div>`;};
  const v=$("#view");
  v.innerHTML=`${canWrite?"":`<div class="banner">Read-only: you can view weekly sheets but not change them.</div>`}
  <section class="sec"><div class="row" style="justify-content:space-between">
   <div class="row"><h2>Week</h2><select id="ew" aria-label="Week">${[...Array(config.weeks)].map((_,i)=>`<option value="${i+1}" ${i+1===entryWeek?"selected":""}>Week ${i+1}${weeks[i+1]?" ✓":""}</option>`).join("")}</select>
   <label class="f" style="flex-direction:row;align-items:center;gap:8px">Date <input type="date" id="edate" value="${esc(draft.date)}" ${dis}></label></div>
   <div class="row" id="saveRow"><button class="btn" id="saveWeek" ${dis}>Save week ${entryWeek}</button>${weeks[entryWeek]?`<button class="btn danger" id="clearWeek" ${dis}>Clear week</button>`:""}</div></div>
   <p class="note">Handicaps shown are based on averages entering this week. Tick <b>Abs</b> for an absent bowler: the team gets a blind score of average − ${config.absentPenalty} each game. Match points update as you type.</p>
  </section>
  ${draft.matchups.map((m,mi)=>`<section class="card match"><div class="match-head">
    <div class="row"><select data-m="${mi}" data-side="a" ${dis} aria-label="Home team">${teamOpts(m.a)}</select><span class="vs">VS</span><select data-m="${mi}" data-side="b" ${dis} aria-label="Away team">${teamOpts(m.b)}</select></div>
    <div id="pts_${mi}" class="row small"></div></div>
    <div class="grid2">${side(m.a,mi,"a")}${side(m.b,mi,"b")}</div></section>`).join("")}`;
  updateTotals();
}
function nameCell(p,e,dis){
  if(!config.subs.length) return esc(p.name);
  return `<select id="sub_${p.id}" data-sub="${p.id}" ${dis} ${e.abs?"disabled":""} aria-label="Who bowled for ${esc(p.name)}" style="max-width:11em">
    <option value="">${esc(p.name)}</option>${config.subs.map(s=>`<option value="${s.id}" ${e.sub===s.id?"selected":""}>Sub: ${esc(s.name)}</option>`).join("")}</select>`;
}
function entering(w){
  // averages/handicaps entering week w = computed from weeks before w only
  const saved=weeks; const before={}; for(const k in saved) if(Number(k)<w) before[k]=saved[k];
  const keep=weeks; weeks=before; const S=compute(); weeks=keep;
  const out={}; for(const pid in S.players){const p=S.players[pid]; out[pid]={avg:p.avg,hcp:p.hcp};} return out;
}
function updateTotals(){
  const G=config.gamesPerWeek, en=entering(entryWeek);
  const bw=pid=>{const e=draft.games[pid]||{}; return (!e.abs&&e.sub&&en[e.sub])?e.sub:pid;};
  const val=(pid,g)=>{const e=draft.games[pid]||{}; if(e.abs) return Math.max(0,en[pid].avg-config.absentPenalty); const x=(e.g||[])[g]; return x===""||x==null?null:Number(x);};
  config.teams.forEach(t=>t.players.forEach(p=>{const c=document.getElementById("ser_"+p.id); if(!c) return;
    const gs=[...Array(G)].map((_,g)=>val(p.id,g)); c.textContent=gs.some(v=>v!=null)?gs.reduce((s,v)=>s+(v??0),0):"";}));
  draft.matchups.forEach((m,mi)=>{
    const tot={}; for(const k of ["a","b"]){const t=config.teams.find(x=>x.id===m[k]); if(!t) continue;
      tot[k]=[...Array(G)].map((_,g)=>t.players.some(p=>val(p.id,g)==null)?null:t.players.reduce((s,p)=>s+val(p.id,g)+en[bw(p.id)].hcp,0));
      tot[k].forEach((v,g)=>{const c=document.getElementById(`tt_${mi}_${k}_${g}`); if(c) c.textContent=v??"";});
      const c=document.getElementById(`tt_${mi}_${k}_s`); if(c) c.textContent=tot[k].every(v=>v!=null)?tot[k].reduce((s,v)=>s+v,0):"";}
    let pa=0,pb=0,done=true; for(let g=0;g<G;g++){const A=tot.a?.[g],B=tot.b?.[g]; if(A==null||B==null){done=false;continue;}
      if(A>B)pa+=config.ptsPerGame; else if(B>A)pb+=config.ptsPerGame; else{pa+=config.ptsPerGame/2;pb+=config.ptsPerGame/2;}}
    if(done){const A=tot.a.reduce((s,v)=>s+v,0),B=tot.b.reduce((s,v)=>s+v,0); if(A>B)pa+=config.ptsSeries; else if(B>A)pb+=config.ptsSeries; else{pa+=config.ptsSeries/2;pb+=config.ptsSeries/2;}}
    const el=document.getElementById("pts_"+mi); if(el){const na=esc(config.teams.find(x=>x.id===m.a)?.name), nb=esc(config.teams.find(x=>x.id===m.b)?.name);
      el.innerHTML=`<span class="pill ${pa>pb?"win":pa<pb?"loss":""}">${na} ${fmt(pa)}</span><span class="pill ${pb>pa?"win":pb<pa?"loss":""}">${nb} ${fmt(pb)}</span>${done?"":'<span class="muted">series point pending</span>'}`;}
  });
}

  <div class="grid2">${config.teams.map((t,i)=>`<div class="card sec"><label class="f">Team ${i+1}<input id="tn_${t.id}" value="${esc(t.name)}" ${dis}></label>
    <div class="tbl" style="border:0"><table><thead><tr><th>Bowler</th><th>Starting Avg</th><th>Order</th></tr></thead><tbody>

    <td class="mv"><button class="mvb" data-mv="${t.id}|${j}|-1" ${dis||(j===0?"disabled":"")} aria-label="Move ${esc(p.name)} up">▲</button><button class="mvb" data-mv="${t.id}|${j}|1" ${dis||(j===t.players.length-1?"disabled":"")} aria-label="Move ${esc(p.name)} down">▼</button></td></tr>`).join("")}
    </tbody></table></div></div>`).join("")}</div>

function subsCard(dis){
  const S=compute();
  return `<div class="card sec"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Substitutes</h3><button class="btn ghost" id="addSub" ${dis}>Add sub</button></div>
  <p class="note">Subs can bowl for any team. In Enter Scores, choose the sub from the absent bowler's name. The team uses the sub's score and handicap, and the games count toward the sub's own average and highs. Save teams after renaming subs.</p>
  ${config.subs.length?`<div class="tbl" style="border:0"><table><thead><tr><th>Sub</th><th>Starting Avg</th><th>Games</th><th>Average</th><th></th></tr></thead><tbody>
  ${config.subs.map(s=>{const p=S.players[s.id]; return `<tr><td class="l"><input id="sn_${s.id}" value="${esc(s.name)}" style="width:100%;min-width:8em" ${dis} aria-label="Sub name"></td>
   <td><input id="sa_${s.id}" class="g" style="width:4.5em" inputmode="numeric" value="${s.startAvg||""}" ${dis} aria-label="Starting average"></td>
   <td>${p.games}</td><td>${p.avg||"—"}</td><td>${p.games?'<span class="muted small">has bowled</span>':`<button class="btn danger" data-rm="${s.id}" ${dis} style="padding:5px 10px">Remove</button>`}</td></tr>`;}).join("")}
  </tbody></table></div>`:`<p class="muted small">No subs yet. Add one to let them bowl for any team.</p>`}</div>`;
}
function collectTeams(){
  const c=JSON.parse(JSON.stringify(config));
  c.teams.forEach(tm=>{const n=$("#tn_"+tm.id); if(n) tm.name=n.value.trim()||tm.name;
    tm.players.forEach(p=>{const a=$("#pn_"+p.id), b=$("#pa_"+p.id); if(a) p.name=a.value.trim()||p.name; if(b) p.startAvg=clamp(parseInt(b.value)||0,0,300);});});
  c.subs.forEach(s=>{const a=$("#sn_"+s.id), b=$("#sa_"+s.id); if(a) s.name=a.value.trim()||s.name; if(b) s.startAvg=clamp(parseInt(b.value)||0,0,300);});
  return c;
}

function formula(){const f=$("#s_formula"); if(!f) return; const p=+$("#s_pct").value||0,b=+$("#s_basis").value||0;
  const ex=180, h=Math.floor(Math.max(0,b-ex)*p/100); f.textContent=`${p}% × (${b} − avg) · a ${ex} bowler gets ${h}`;}
function readSettings(){
  const g=id=>Number($("#"+id).value);
  const c={...(config||DEFAULTS), name:$("#s_name").value.trim()||"Bowling League", teamsCount:clamp(g("s_teams"),2,40), playersPerTeam:clamp(g("s_ppt"),1,10),
    weeks:clamp(g("s_weeks"),1,60), gamesPerWeek:clamp(g("s_gpw"),1,5), hcpPct:clamp(g("s_pct"),0,100), hcpBasis:clamp(g("s_basis"),100,300),
    hcpMax:clamp(g("s_max"),0,300), ptsPerGame:clamp(g("s_ppg"),0,10), ptsSeries:clamp(g("s_pser"),0,10), absentPenalty:clamp(g("s_abs"),0,100)};
  return normalize(c);
}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,Number.isFinite(v)?v:a));

// ---------- weekly results ----------
let resultsWeek=null;
const teamById=id=>config.teams.find(t=>t.id===id);
function weekDetail(w){
  const wk=weeks[w]; if(!wk) return [];
  const G=config.gamesPerWeek, en=entering(w);
  const side=tid=>{ const t=teamById(tid);
    const rows=t.players.map(p=>{ const e=(wk.games||{})[p.id]||{}; const sub=!e.abs&&e.sub?config.subs.find(s=>s.id===e.sub):null; const by=sub||p; const x=en[by.id]||{avg:0,hcp:0};
      const gs=[...Array(G)].map((_,g)=>{ if(e.abs) return Math.max(0,x.avg-config.absentPenalty); const v=(e.g||[])[g]; return v==null||v===""?null:Number(v); });
      return {name:by.name,roster:p.name,sub:!!sub,abs:!!e.abs,hcp:x.hcp,gs}; });
    const scr=[...Array(G)].map((_,g)=>rows.some(r=>r.gs[g]==null)?null:rows.reduce((s,r)=>s+r.gs[g],0));
    const hc=rows.reduce((s,r)=>s+r.hcp,0);
    return {t,rows,scr,hc,tot:scr.map(v=>v==null?null:v+hc)}; };
  return (wk.matchups||[]).filter(m=>teamById(m.a)&&teamById(m.b)).map(m=>{
    const A=side(m.a), B=side(m.b); let pa=0,pb=0,done=true;
    for(let g=0;g<G;g++){ const a=A.tot[g],b=B.tot[g]; if(a==null||b==null){done=false;continue;}
      if(a>b) pa+=config.ptsPerGame; else if(b>a) pb+=config.ptsPerGame; else {pa+=config.ptsPerGame/2;pb+=config.ptsPerGame/2;} }
    const sa=A.tot.reduce((s,v)=>s+(v??0),0), sb=B.tot.reduce((s,v)=>s+(v??0),0);
    if(done){ if(sa>sb) pa+=config.ptsSeries; else if(sb>sa) pb+=config.ptsSeries; else {pa+=config.ptsSeries/2;pb+=config.ptsSeries/2;} }
    return {A,B,pa,pb,sa,sb,done}; });
}
function resultTable(X,Y,G,done,sx,sy){
  const sum=a=>a.every(v=>v!=null)?a.reduce((s,v)=>s+v,0):"";
  const cls=(a,b)=>a!=null&&b!=null&&a>b?' class="win"':"";
  return `<div class="tbl"><table><thead><tr><th class="l">${esc(X.t.name)}</th><th>Hdcp</th>${[...Array(G)].map((_,g)=>`<th>G${g+1}</th>`).join("")}<th>Series</th></tr></thead><tbody>
  ${X.rows.map(r=>`<tr class="${r.abs?"abs":""}"><td class="l">${r.abs?`${esc(r.roster)} <span class="pill">absent · blind</span>`:r.sub?`${esc(r.name)} <span class="pill">sub for ${esc(r.roster)}</span>`:esc(r.name)}</td><td>${r.hcp}</td>
    ${r.gs.map(v=>`<td>${v??""}</td>`).join("")}<td class="num-strong">${r.gs.some(v=>v!=null)?r.gs.reduce((s,v)=>s+(v??0),0):""}</td></tr>`).join("")}
  <tr class="sub-tot"><td class="l">Scratch</td><td></td>${X.scr.map(v=>`<td>${v??""}</td>`).join("")}<td>${sum(X.scr)}</td></tr>
  <tr class="sub-tot"><td class="l">Handicap</td><td></td>${X.scr.map(()=>`<td>${X.hc}</td>`).join("")}<td>${X.hc*G}</td></tr>
  <tr class="tot"><td class="l">Total</td><td></td>${X.tot.map((v,g)=>`<td${cls(v,Y.tot[g])}>${v??""}</td>`).join("")}<td${done?cls(sx,sy):""}>${done?sx:""}</td></tr>
  </tbody></table></div>`;
}
function weekResultsHtml(w){
  const G=config.gamesPerWeek, ms=weekDetail(w);
  if(!ms.length) return `<div class="card empty">No matches recorded for week ${w}.</div>`;
  return ms.map(m=>`<article class="card match"><div class="match-head">
    <div class="row"><b>${esc(m.A.t.name)}</b><span class="pill ${m.pa>m.pb?"win":m.pa<m.pb?"loss":""}">${fmt(m.pa)}</span><span class="vs">VS</span><span class="pill ${m.pb>m.pa?"win":m.pb<m.pa?"loss":""}">${fmt(m.pb)}</span><b>${esc(m.B.t.name)}</b></div>
    ${m.done?"":'<span class="pill">in progress</span>'}</div>
    <div class="grid2">${resultTable(m.A,m.B,G,m.done,m.sa,m.sb)}${resultTable(m.B,m.A,G,m.done,m.sb,m.sa)}</div></article>`).join("");
}
function resultsView(S){
  const wks=S.weeksBowled; if(resultsWeek==null||!wks.includes(resultsWeek)) resultsWeek=wks[wks.length-1]??null;
  if(!resultsWeek) return `<section class="sec"><h2>Weekly Results</h2><div class="card empty">No scores yet. Open <b>Enter Scores</b> to record week 1.</div></section>`;
  return `<section class="sec"><div class="row"><h2>Weekly Results</h2><select id="resw" aria-label="Week">${wks.map(w=>`<option value="${w}" ${w===resultsWeek?"selected":""}>Week ${w}${weeks[w]?.date?" · "+esc(weeks[w].date):""}</option>`).join("")}</select></div>
  <p class="note">Green totals won that game. Handicaps are each bowler's handicap entering the week.</p>${weekResultsHtml(resultsWeek)}</section>`;
}

// ---------- print & export ----------
function top3(arr){ const seen=new Set(), items=[]; for(const x of arr){ if(seen.has(x.pid)) continue; seen.add(x.pid); items.push(x); if(items.length===3) break; } return items; }
let recapWeek=null, pendingRestore=null;
const RECAP_CSS=`.rc{background:#fff;color:#111;font:10px/1.25 "Public Sans",Arial,sans-serif;padding:14px;width:7.4in;box-sizing:border-box}
.rc h1{font:800 20px "Big Shoulders Display","Arial Narrow",Arial,sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0;color:#111}
.rc .sub{color:#555;margin:1px 0 0}

function weekLines(w){
  const wk=weeks[w]; const out={}; if(!wk) return out;
  for(const t of config.teams) for(const p of t.players){ const e=(wk.games||{})[p.id]; if(!e) continue;
    if(e.abs) out[p.id]={abs:true}; else out[(e.sub&&config.subs.some(s=>s.id===e.sub))?e.sub:p.id]={g:e.g||[], forTeam:t.name}; }
  return out;
}
function recapBody(S,w){
  const G=config.gamesPerWeek, wk=weeks[w]||{}, tn=id=>esc(config.teams.find(t=>t.id===id)?.name);
  const ts=Object.values(S.teams).sort((a,b)=>b.won-a.won||b.hdcp-a.hdcp);
  const games=wk.games||{}, subFor={};
  for(const t of config.teams) for(const p of t.players){ const e=games[p.id]; if(e&&!e.abs&&e.sub) subFor[e.sub]={g:e.g||[],team:t.name}; }
  const gcells=(gs)=>{ const real=gs.filter(v=>v!=null); return gs.map(v=>`<td>${v??""}</td>`).join("")+`<td><b>${real.length?real.reduce((a,b)=>a+b,0):""}</b></td>`; };
  const tail=x=>`<td>${x.avg||""}</td><td>${x.avg?x.hcp:""}</td>`;
  const prow=p=>{ const x=S.players[p.id], e=games[p.id];
    let cells; if(!e) cells=`<td colspan="${G+1}"></td>`;
    else if(e.abs) cells=`<td colspan="${G+1}" class="l m">absent (blind)</td>`;
    else if(e.sub){ const s=config.subs.find(q=>q.id===e.sub); cells=`<td colspan="${G+1}" class="l m">sub: ${esc(s?.name||"")}</td>`; }
    else cells=gcells([...Array(G)].map((_,g)=>{const v=(e.g||[])[g]; return v==null||v===""?null:Number(v);}));
    return `<tr><td class="l">${esc(p.name)}</td>${cells}${tail(x)}</tr>`; };
  const head=title=>`<thead><tr><th class="l">${title}</th>${[...Array(G)].map((_,g)=>`<th>G${g+1}</th>`).join("")}<th>Ser</th><th>Avg</th><th>Hdcp</th></tr></thead>`;
  const subRows=config.subs.filter(s=>subFor[s.id]).map(s=>`<tr><td class="l">${esc(s.name)} <span class="m">for ${esc(subFor[s.id].team)}</span></td>${gcells([...Array(G)].map((_,g)=>{const v=subFor[s.id].g[g]; return v==null||v===""?null:Number(v);}))}${tail(S.players[s.id])}</tr>`).join("");
  const Wk=S.weekly[w]||{sg:[],ss:[],hg:[],hs:[],tsg:[],tss:[],thg:[],ths:[]};
  const cell=(x,season)=>x?`<td class="l"><div class="hc"><span>${esc(x.name)}${season?` <i class="m">w${x.week}</i>`:""}</span><b>${x.v}</b></div></td>`:`<td></td>`;
  const hrow=(label,k)=>{ const a=top3(Wk[k]), b=top3(S.season[k]); return `<tr><td class="l"><b>${label}</b></td>${[0,1,2].map(i=>cell(a[i])).join("")}${[0,1,2].map(i=>cell(b[i],1)).join("")}</tr>`; };
  return `<h1>${esc(config.name)}</h1>
  <p class="sub">Week ${w} of ${config.weeks}${wk.date?" · "+esc(wk.date):""} · Handicap ${config.hcpPct}% of ${config.hcpBasis}${config.hcpMax>0?`, max ${config.hcpMax}`:""} · Avg and Hdcp are for next week</p>
  <div class="two"><div><h2>Standings</h2><table><thead><tr><th></th><th class="l">Team</th><th>Won</th><th>Lost</th><th>Scratch</th><th>+Hdcp</th></tr></thead><tbody>
  ${ts.map((t,i)=>`<tr><td>${i+1}</td><td class="l">${esc(t.name)}</td><td><b>${fmt(t.won)}</b></td><td>${fmt(t.lost)}</td><td>${t.scratch.toLocaleString()}</td><td>${t.hdcp.toLocaleString()}</td></tr>`).join("")}</tbody></table></div>
  <div><h2>Week ${w} Results</h2><table><thead><tr><th class="l">Team</th><th>Pts</th><th>Total</th><th class="l">Opponent</th><th>Pts</th><th>Total</th></tr></thead><tbody>
  ${(S.results[w]||[]).map(r=>`<tr><td class="l">${tn(r.a)}</td><td><b>${fmt(r.pa)}</b></td><td>${r.ta.toLocaleString()}</td><td class="l">${tn(r.b)}</td><td><b>${fmt(r.pb)}</b></td><td>${r.tb.toLocaleString()}</td></tr>`).join("")}</tbody></table></div></div>
  <h2>Bowlers</h2><div class="teams">${config.teams.map(t=>`<table class="tm">${head(esc(t.name))}<tbody>${t.players.map(prow).join("")}</tbody></table>`).join("")}
  ${subRows?`<table class="tm">${head("Subs")}<tbody>${subRows}</tbody></table>`:""}</div>
  <h2>High Scores</h2><table class="hs"><colgroup><col class="c">${"<col>".repeat(6)}</colgroup><thead><tr><th class="l"></th><th class="l" colspan="3">Week ${w}</th><th class="l" colspan="3">Season</th></tr></thead><tbody>
  ${hrow("Game","sg")}${hrow("Series","ss")}${hrow("Game hdcp","hg")}${hrow("Series hdcp","hs")}${hrow("Team game","tsg")}${hrow("Team series","tss")}${hrow("Team game hdcp","thg")}${hrow("Team series hdcp","ths")}
  </tbody></table>`;
}
function computeThrough(w){ const keep=weeks, sub={}; for(const k in keep) if(Number(k)<=w) sub[k]=keep[k]; weeks=sub; const S=compute(); weeks=keep; return S; }

const slug=()=>(config.name||"league").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"league";
const csv=rows=>rows.map(r=>r.map(v=>{v=v==null?"":String(v); return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;}).join(",")).join("\r\n")+"\r\n";
function dl(filename,data){
  const type=filename.endsWith(".csv")?"text/csv":filename.endsWith(".json")?"application/json":"text/html";
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:type+";charset=utf-8"})); a.download=filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},2000); toast("Downloaded "+filename);
}
function exportCsv(kind){
  const S=compute(), G=config.gamesPerWeek;
  if(kind==="stand"){ const ts=Object.values(S.teams).sort((a,b)=>b.won-a.won||b.hdcp-a.hdcp);
    return dl(`${slug()}-standings.csv`,csv([["Rank","Team","Won","Lost","Pct","Scratch Pins","Pins + Hdcp"],...ts.map((t,i)=>[i+1,t.name,t.won,t.lost,t.won+t.lost?(t.won/(t.won+t.lost)).toFixed(3):"",t.scratch,t.hdcp])])); }
  if(kind==="avg"){ const ps=Object.values(S.players).sort((a,b)=>b.avg-a.avg);
    return dl(`${slug()}-averages.csv`,csv([["Bowler","Team","Games","Pins","Average","Handicap","High Game","High Series"],...ps.map(p=>[p.name,p.team,p.games,p.pins,p.avg||"",p.avg?p.hcp:"",p.hg||"",p.hs||""])])); }
  const rows=[["Week","Date","Team","Roster Bowler","Bowled By","Absent","Handicap",...[...Array(G)].map((_,g)=>"Game "+(g+1)),"Series"]];
  for(const w of Object.keys(weeks).map(Number).sort((a,b)=>a-b)){ const wk=weeks[w], en=entering(w);
    for(const t of config.teams) for(const p of t.players){ const e=(wk.games||{})[p.id]; if(!e) continue;
      const sub=!e.abs&&e.sub?config.subs.find(s=>s.id===e.sub):null; const by=sub||p; const h=en[by.id]?.hcp??"";
      const gs=[...Array(G)].map((_,g)=>e.abs?"":(e.g||[])[g]??""); const real=gs.filter(v=>v!=="");
      rows.push([w,wk.date||"",t.name,p.name,e.abs?"":by.name+(sub?" (sub)":""),e.abs?"yes":"",h,...gs,real.length?real.reduce((a,b)=>a+Number(b),0):""]); } }
  return dl(`${slug()}-all-scores.csv`,csv(rows));
}

    const keep=new Set();
    for(const w of b.weeks){ const id="w"+String(w.week).padStart(2,"0"); keep.add(id); await db.doc("weeks/"+id).set(w); }

const GH_KEY="leagueSecretary.github.v1";
function ghSettings(){ try{ return JSON.parse(localStorage.getItem(GH_KEY))||{}; }catch(_){ return {}; } }
function ghStore(s){ try{ localStorage.setItem(GH_KEY,JSON.stringify(s)); }catch(_){ toast("Couldn't save the website settings on this device."); } }
const ghReady=()=>{ const s=ghSettings(); return !!(s.owner&&s.repo&&s.token); };
function siteUrl(s=ghSettings()){ if(!s.owner||!s.repo) return ""; const o=s.owner.toLowerCase(); return s.repo.toLowerCase()===o+".github.io"?`https://${o}.github.io/`:`https://${o}.github.io/${s.repo}/`; }
const b64=str=>{ const bytes=new TextEncoder().encode(str); let bin=""; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000)); return btoa(bin); };
const unb64=c=>new TextDecoder().decode(Uint8Array.from(atob(c.replace(/\s/g,"")),ch=>ch.charCodeAt(0)));
async function gh(path,opts={},s=ghSettings()){
  return fetch(`https://api.github.com/repos/${encodeURIComponent(s.owner)}/${encodeURIComponent(s.repo)}${path}`,{...opts,cache:"no-store",
    headers:{Authorization:`Bearer ${s.token}`,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",...(opts.body?{"Content-Type":"application/json"}:{})}});
}
function ghErr(status){
  if(status===401) return "GitHub didn't accept the token. Check that it was copied in full and hasn't expired.";
  if(status===404) return "Repository not found. Check the username and repository name, and that the token was given access to this repository.";
  if(status===403) return "The token can't write to this repository. Edit the token and set Contents to “Read and write”.";
  if(status===409||status===422) return "GitHub refused the update. Wait a few seconds and publish again.";
  return "Couldn't reach GitHub. Check the internet connection and try again.";
}
async function ghPut(file,b64content,msg,branch){
  let sha; const g=await gh(`/contents/${file}?ref=${encodeURIComponent(branch)}`);
  if(g.ok) sha=(await g.json()).sha; else if(g.status!==404) throw new Error(ghErr(g.status));
  const r=await gh(`/contents/${file}`,{method:"PUT",body:JSON.stringify({message:msg,content:b64content,branch,...(sha?{sha}:{})})});
  if(!r.ok) throw new Error(ghErr(r.status));
}
async function ghExists(file,branch){ const g=await gh(`/contents/${file}?ref=${encodeURIComponent(branch)}`); return g.ok; }

function iconPng(size,mask){

async function ghRestore(){
  if(!ghReady()) return toast("Connect to GitHub first.");
  setWebStatus("Downloading backup from your website…");
  try{ const s=ghSettings(); const r=await gh(`/contents/league-backup.json?ref=${encodeURIComponent(s.branch||"main")}`);
    if(r.status===404) return setWebStatus("No online backup yet. It's saved each time you publish.",true);
    if(!r.ok) throw new Error(ghErr(r.status));
    const b=JSON.parse(unb64((await r.json()).content));
    if(!b||!b.config||!Array.isArray(b.weeks)) throw new Error("The online backup couldn't be read.");
    askRestore(b); setWebStatus("");
  }catch(e){ setWebStatus(e.message,true); }
}

function highsStatic(S,last){
  const ind=(X,sw)=>`${topList("High Game · Scratch",X.sg,sw)}${topList("High Series · Scratch",X.ss,sw)}${topList("High Game · Handicap",X.hg,sw)}${topList("High Series · Handicap",X.hs,sw)}`;
  const tm=(X,sw)=>`${topList("Team High Game · Scratch",X.tsg,sw)}${topList("Team High Series · Scratch",X.tss,sw)}${topList("Team High Game · Handicap",X.thg,sw)}${topList("Team High Series · Handicap",X.ths,sw)}`;
  return `<section class="sec" id="highs"><h2>Season Highs</h2><h3>Individual</h3><div class="highs">${ind(S.season,1)}</div><h3>Team</h3><div class="highs">${tm(S.season,1)}</div></section>
  ${last?`<section class="sec"><h2>Week ${last} Highs</h2><h3>Individual</h3><div class="highs">${ind(S.weekly[last])}</div><h3>Team</h3><div class="highs">${tm(S.weekly[last])}</div>
  <p class="note">Each bowler or team appears once per list. Individual series counts only bowlers who bowled every game; blind scores are left out.</p></section>`:""}`;
}
function publicPage(){
  const S=compute(), last=S.weeksBowled[S.weeksBowled.length-1];
  const css=document.getElementById("appcss").textContent;
  const meta=`${config.teamsCount} teams · week ${S.weeksBowled.length} of ${config.weeks} · handicap ${config.hcpPct}% of ${config.hcpBasis}`;
  const teamsHtml=`<section class="sec" id="teams"><h2>Teams</h2><div class="grid2">${config.teams.map(t=>`<div class="card"><h3>${esc(t.name)}</h3><table><tbody>${t.players.map(p=>{const x=S.players[p.id]; return `<tr><td class="l">${esc(p.name)}</td><td>${x.avg?`avg ${x.avg} · hdcp ${x.hcp}`:""}</td></tr>`;}).join("")}</tbody></table></div>`).join("")}</div></section>`;
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>${esc(config.name)}</title><meta name="theme-color" content="#1d5aa0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>${css}</style></head><body>
<header class="band"><div class="wrap"><div class="brand"><h1>${esc(config.name)}</h1><span class="meta">${esc(meta)}</span></div>
<nav class="tabs"><a href="#standings">Standings</a><a href="#results">Weekly Results</a><a href="#averages">Averages</a><a href="#highs">High Scores</a><a href="#teams">Teams</a>${last?'<a href="recap.html">Printable recap</a>':""}</nav></div></header>
<main><div class="wrap"><div id="standings"></div>${standings(S)}<div id="results"></div>${S.weeksBowled.length?`<section class="sec"><h2>Weekly Results</h2><p class="note">Green totals won that game.</p>${[...S.weeksBowled].reverse().map((w,i)=>i===0?`<h3>Week ${w}${weeks[w]?.date?" · "+esc(weeks[w].date):""}</h3>${weekResultsHtml(w)}`:`<details class="card"><summary><b>Week ${w}</b>${weeks[w]?.date?" · "+esc(weeks[w].date):""}</summary><div class="sec" style="margin-top:12px">${weekResultsHtml(w)}</div></details>`).join("")}</section>`:""}<div id="averages"></div>${bowlers(S)}${highsStatic(S,last)}${teamsHtml}
<p class="note">Updated ${esc(new Date().toLocaleString([], {dateStyle:"medium",timeStyle:"short"}))}.</p></div></main></body></html>`;
}

  $("#view").innerHTML=`<section class="sec"><h2>League Website</h2>
  ${ready?`<div class="card sec"><h3>Your website</h3><p class="formula" style="word-break:break-all;user-select:all">${esc(url)}</p>
    <p class="note">Share this address with your bowlers. They can see standings, averages and high scores without signing in to anything. Last published: <b>${esc(lp)}</b>.</p>

    <p class="note">Publishing also saves an online backup of the whole league. Publish after you save each week.</p></div>`

   <li>Tap <b>+</b> then <b>New repository</b>. Name it <b>league</b>, choose <b>Public</b>, tick <b>Add a README file</b>, and tap <b>Create repository</b>.</li>

   <li>Open the repository's <b>Settings</b>, then <b>Pages</b>. Under Branch choose <b>main</b> and <b>/ (root)</b>, then <b>Save</b>.</li>

// ---------- writes ----------
async function saveConfig(c,msg){
  if(!db) return toast("Saving isn't available here.");
  try{ await db.doc("league/config").set(c); toast(msg); }
  catch(e){ toast("Couldn't save. You may not have edit access, or the connection dropped. Try again."); }
}
async function saveWeek(){
  for(const inp of document.querySelectorAll("input.g.bad")){ inp.focus(); return toast("Scores must be whole numbers from 0 to 300."); }
  const games={}; for(const pid in draft.games){const e=draft.games[pid]; if(e.abs||e.sub||(e.g||[]).some(v=>v!==""&&v!=null)) games[pid]={abs:!!e.abs,sub:(!e.abs&&e.sub)||null,g:(e.g||[]).map(v=>v===""||v==null?null:Number(v))};}
  const body={week:entryWeek,date:draft.date||"",matchups:draft.matchups,games,updatedAt:new Date().toISOString()};
  try{ await db.doc("weeks/w"+String(entryWeek).padStart(2,"0")).set(body); draftDirty=false; toast(`Week ${entryWeek} saved.`); }
  catch(e){ toast("Couldn't save the week. You may not have edit access, or the connection dropped. Try again."); }
}

// ---------- events ----------
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]"); if(!b) return; tab=b.dataset.tab; render();});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.matches("input.g[data-p]")){ const v=t.value.trim(); const ok=v===""||(/^\d{1,3}$/.test(v)&&+v<=300); t.classList.toggle("bad",!ok);
    const e2=draft.games[t.dataset.p]||(draft.games[t.dataset.p]={g:[]}); e2.g=e2.g||[]; e2.g[+t.dataset.g]=ok&&v!==""?+v:null; draftDirty=true; updateTotals(); }
  else if(t.id==="edate"){ draft.date=t.value; draftDirty=true; }
  else if(t.id==="s_pct"||t.id==="s_basis") formula();
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="ew"){ entryWeek=+t.value; draft=null; render(); }
  else if(t.id==="hw"){ highsWeek=+t.value; render(); }
  else if(t.id==="resw"){ resultsWeek=+t.value; render(); }
  else if(t.id==="rw"){ recapWeek=+t.value; render(); }
  else if(t.id==="restoreFile"&&t.files?.[0]){
    t.files[0].text().then(txt=>{ let b; try{ b=JSON.parse(txt); }catch(_){ b=null; }
      if(!b||!b.config||!Array.isArray(b.config.teams)||!Array.isArray(b.weeks)) return toast("That file isn't a League Secretary backup.");
      askRestore(b); t.value="";
    }); }
  else if(t.dataset.abs){ const e2=draft.games[t.dataset.abs]||(draft.games[t.dataset.abs]={g:[]}); e2.abs=t.checked; if(t.checked) e2.sub=null; draftDirty=true; render(); }
  else if(t.dataset.sub!==undefined){ const e2=draft.games[t.dataset.sub]||(draft.games[t.dataset.sub]={g:[]}); e2.sub=t.value||null; draftDirty=true; render(); }
  else if(t.dataset.m){ draft.matchups[+t.dataset.m][t.dataset.side]=t.value; draftDirty=true; render(); }
});
document.addEventListener("click",async e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.id==="saveWeek") saveWeek();
  else if(t.id==="clearWeek"){ $("#saveRow").innerHTML=`<span class="confirm">Delete all scores for week ${entryWeek}? <button class="btn danger" id="clearYes">Delete</button><button class="btn ghost" id="clearNo">Keep</button></span>`; }
  else if(t.id==="clearNo") render();
  else if(t.id==="clearYes"){ try{ await db.doc("weeks/w"+String(entryWeek).padStart(2,"0")).delete(); draft=null; toast(`Week ${entryWeek} cleared.`);}catch(_){toast("Couldn't clear the week. Try again.");} }
  else if(t.id==="saveSettings"){ const isNew=!config; const c=readSettings(); if(isNew) tab="teams"; await saveConfig(c,isNew?"League created.":"Settings saved."); }
  else if(t.id==="dlRecap") exportRecap();
  else if(t.id==="dlStand") exportCsv("stand");
  else if(t.id==="dlAvg") exportCsv("avg");
  else if(t.id==="dlScores") exportCsv("scores");
  else if(t.id==="dlBackup") dl(`${slug()}-backup-${new Date().toISOString().slice(0,10)}.json`,backupData());
  else if(t.id==="restoreYes"&&pendingRestore) doRestore();
  else if(t.id==="restoreNo"){ pendingRestore=null; render(); }
  else if(t.id==="ghSave") ghSaveSettings();
  else if(t.id==="ghPublish") ghPublish();
  else if(t.id==="ghRestore") ghRestore();
  else if(t.id==="ghForget"){ const x=ghSettings(); delete x.token; ghStore(x); toast("Token removed from this device."); render(); }
  else if(t.id==="saveTeams"){ await saveConfig(collectTeams(),"Teams saved."); }
  else if(t.id==="addSub"){ const c=collectTeams(); c.subs.push({id:"s"+Date.now().toString(36),name:`Sub ${c.subs.length+1}`,startAvg:0}); await saveConfig(c,"Sub added. Rename them below."); }
  else if(t.dataset.mv){ const [tid,j,d]=t.dataset.mv.split("|"); const c=collectTeams(); const ps=c.teams.find(x=>x.id===tid).players; const i=+j, k=i+Number(d);
    if(k<0||k>=ps.length) return; [ps[i],ps[k]]=[ps[k],ps[i]]; await saveConfig(c,"Bowling order saved."); }
  else if(t.dataset.rm){ const c=collectTeams(); c.subs=c.subs.filter(s=>s.id!==t.dataset.rm); await saveConfig(c,"Sub removed."); }
});

// ---------- data (saved on this device) ----------
const LS="leagueSecretary.data.v1";
function loadStore(){ try{ const x=JSON.parse(localStorage.getItem(LS)); if(x&&typeof x==="object") return {config:x.config||null,weeks:x.weeks||{}}; }catch(_){} return {config:null,weeks:{}}; }
let store=loadStore(); const listeners={doc:null,col:null};
const clone=o=>JSON.parse(JSON.stringify(o));
const docSnap=()=>({exists:!!store.config,data:()=>clone(store.config),metadata:{fromCache:false}});
const colSnap=()=>({docs:Object.values(store.weeks).map(w=>({data:()=>clone(w)}))});
function notify(){ setTimeout(()=>{ listeners.doc&&listeners.doc(docSnap()); listeners.col&&listeners.col(colSnap()); },0); }
function persist(){ try{ localStorage.setItem(LS,JSON.stringify(store)); }catch(e){ toast("Couldn't save on this device. Download a backup now."); throw e; } }
const local={
  doc(path){ const [c,id]=path.split("/"); return {
    async set(d){ if(c==="league") store.config=clone(d); else store.weeks[id]=clone(d); persist(); notify(); },
    async delete(){ if(c==="league") store.config=null; else delete store.weeks[id]; persist(); notify(); },
    onSnapshot(next){ listeners.doc=next; next(docSnap()); return ()=>{}; } }; },
  collection(){ return { onSnapshot(next){ listeners.col=next; next(colSnap()); return ()=>{}; } }; }
};
window.addEventListener("storage",e=>{ if(e.key===LS){ store=loadStore(); notify(); } });
function start(){
  db=local; canWrite=true;
  try{ navigator.storage?.persist?.().catch(()=>{}); }catch(_){}
  db.doc("league/config").onSnapshot(s=>{ loaded.config=true; config=s.exists?normalize(s.data()):null; if(tab!=="scores"||!draftDirty) render(); });
  db.collection("weeks").onSnapshot(s=>{ const w={}; s.docs.forEach(d=>{const x=d.data(); if(x&&x.week) w[x.week]=x;}); weeks=w; loaded.weeks=true;
    if(tab==="scores"&&draftDirty) return; if(tab==="scores") draft=null; render(); });
}
start();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
